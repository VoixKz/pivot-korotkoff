<!doctype html>
<meta charset="utf-8">
<title>Сверка признаков JS против Python</title>
<style>
  body { font: 13px/1.6 ui-monospace, Menlo, monospace; background: #0f1113; color: #e8eaed;
         margin: 0; padding: 20px; }
  h1 { font: 600 15px system-ui; }
  table { border-collapse: collapse; margin-top: 12px; }
  td, th { padding: 4px 14px 4px 0; text-align: left; }
  th { color: #9aa3ad; font-weight: 600; border-bottom: 1px solid #2a2f36; }
  .ok { color: #5cc98a; } .bad { color: #ff6b6b; }
  #sum { margin-top: 16px; font: 600 14px system-ui; }
</style>
<h1>Сверка признаков: JavaScript против scipy</h1>
<p style="color:#9aa3ad">Один и тот же сигнал 8 кГц подаётся в обе реализации.
Расхождение по каждому этапу — максимум модуля разности.</p>
<div id="out">считаю…</div>
<div id="sum"></div>

<script type="module">
import * as dsp from "./dsp.js";

const ref = await (await fetch("./reference.json")).json();

function b64ToF32(b64) {
  const bin = atob(b64), buf = new ArrayBuffer(bin.length);
  const view = new Uint8Array(buf);
  for (let i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
  return new Float32Array(buf);
}
const maxAbs = (a, b) => {
  let m = 0;
  for (let i = 0; i < Math.min(a.length, b.length); i++) m = Math.max(m, Math.abs(a[i] - b[i]));
  return m;
};
const rel = (a, b) => {
  let num = 0, den = 0;
  for (let i = 0; i < Math.min(a.length, b.length); i++) {
    num = Math.max(num, Math.abs(a[i] - b[i])); den = Math.max(den, Math.abs(b[i]));
  }
  return den > 0 ? num / den : num;
};

const x = Array.from(b64ToF32(ref.x_b64));
let rms = 0; for (const v of x) rms += v * v;
rms = Math.sqrt(rms / x.length) + 1e-12;
const xn = x.map(v => v / rms);

const y = dsp.sosfiltfilt(xn);
const env = dsp.rmsEnvelope(y);
const per = dsp.periodicity(env);
const bands = dsp.logBandEnergies(xn);
const f = dsp.features(x);

const F = dsp.C.N_BANDS + 2;
const frame = i => Array.from(f.data.slice(i * F, (i + 1) * F));

const rows = [
  ["фильтр 20–200 Гц, начало", rel(Array.from(y.slice(0, 200)), ref.filtered_head)],
  ["фильтр 20–200 Гц, конец",  rel(Array.from(y.slice(-200)), ref.filtered_tail)],
  ["RMS-огибающая",            rel(Array.from(env), ref.env)],
  ["периодичность",            maxAbs(Array.from(per), ref.per)],
  ["лог-полосы, кадр 10",      rel(Array.from(bands[10]), ref.bands_frame10)],
  ["лог-полосы, кадр 300",     rel(Array.from(bands[300]), ref.bands_frame300)],
  ["признаки, кадр 50",        maxAbs(frame(50), ref.feat_frame50)],
  ["признаки, кадр 400",       maxAbs(frame(400), ref.feat_frame400)],
];

const TOL = 2e-3;
let worst = 0;
let html = "<table><tr><th>этап</th><th>расхождение</th><th></th></tr>";
for (const [name, d] of rows) {
  worst = Math.max(worst, d);
  html += `<tr><td>${name}</td><td>${d.toExponential(2)}</td>` +
          `<td class="${d < TOL ? "ok" : "bad"}">${d < TOL ? "совпадает" : "РАСХОЖДЕНИЕ"}</td></tr>`;
}
html += `<tr><td>форма признаков</td><td>${f.T}×${F}</td>` +
        `<td class="${f.T === ref.feat_shape[0] ? "ok" : "bad"}">python ${ref.feat_shape.join("×")}</td></tr>`;
html += "</table>";
document.getElementById("out").innerHTML = html;
document.getElementById("sum").innerHTML = worst < TOL
  ? `<span class="ok">Все этапы совпадают, худшее расхождение ${worst.toExponential(2)}</span>`
  : `<span class="bad">Есть расхождения, худшее ${worst.toExponential(2)}</span>`;
window.__parity = { worst, rows, T: f.T, refT: ref.feat_shape[0] };
</script>
